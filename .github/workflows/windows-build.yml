name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name PDF_Workbench `
            --add-data "index.html;." `
            desktop.py

      - name: Create ZIP
        run: |
          Compress-Archive `
            -Path dist\PDF_Workbench\* `
            -DestinationPath PDF_Workbench-Windows.zip

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Workbench-Windows
          path: PDF_Workbench-Windows.zip


